<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Cairo',Tahoma,sans-serif;color:#fff5e0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;animation:fi .8s}

@keyframes fi{from{opacity:0}to{opacity:1}}
#splash{background:#000;z-index:50}
#dot{width:10px;height:10px;border-radius:50%;background:#ffcf6b;box-shadow:0 0 24px #ff9d3c;animation:pl .9s infinite,gr 2s cubic-bezier(.2,.8,.2,1) forwards}

@keyframes gr{to{width:110px;height:110px;background:transparent;border:5px solid #ffcf6b;box-shadow:0 0 40px #ff9d3c,inset 0 0 30px #ff9d3c}}
#splash h1{font-size:48px;margin:24px 0 4px;opacity:0;animation:fi 1.2s 2s forwards}
#splash small{font-size:14px;opacity:0;animation:fi 1.2s 2.5s forwards}
#menu{align-items:flex-end;padding-right:8vw;z-index:20}

<canvas id="cv"></canvas>

<div id="menu" class="scr">
 <h1>بذرة الفجر</h1>

 <h1 style="font-size:44px">عالم جديد</h1>

 <div class="row">
  <button class="b" data-d="calm">هادئ<small>لا ظلام ولا موت</small></button>
  <button class="b sel" data-d="normal">عادي<small>التجربة الكاملة</small></button>

 </div>

</div>
<div id="load" class="scr"><div id="sd"></div><div id="lb"><div id="lbi"></div></div><div id="tip"></div></div>

<div id="endg" class="scr"><h2>زرعتَ فجراً في عالم نسي الضوء.</h2><p style="opacity:.7">شكراً لأنك أحييت العالم</p><button class="b" id="toMenu" style="text-align:center;padding:0">العودة للقائمة</button></div>

 <div id="bar"></div>

</div>
<div id="sub"></div><div id="toast"></div>

<div id="panel"><div id="pg"></div></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ═══ ثوابت ═══ */
const $=i=>document.getElementById(i);
const N=64,H=40,SZ=N*N,SAVE='fajr_save_v1';
const TC=[0,0x7cbf5a,0x7a5a3a,0x8a8f96,0x6b4a2b,0x4f9a3a,0xe0cf8f,0x8b6b3a,0xffcf6b,0x9a9a9a,0xffcf6b,0xf2f6ff,0xff6fa0];
const NM=['','عشب','تراب','حجر','خشب','أوراق','رمل','بذرة','مشعل','مَوقد','مَوقد حيّ','ثلج','مرجان'];
const BT=[0,.2,.2,.45,.3,.1,.2,.05,.05,0,0,.2,.25];
const HB=[2,3,4,6,5,7,8,1];
const HC=[[16,16],[48,16],[16,48],[48,48]];
const HY=[0,0,0,0];
const TIPS=['الظلام لا يكره النور… بل يخافه','ابنِ مأوى قبل أن يغيب الضوء','كل شجرة تُحييها تُلوّن الأفق','اكسر العشب لتجمع البذور','ازرع البذور قرب المَواقد ثم أشعلها','المشاعل تعيد إليك النور','اضغط E لصنع المشاعل','الليل أقسى من النهار… فاستعد','اضغط F للتحليق والاستكشاف','كل مَوقد يحتاج 10 خشب و10 حجر و5 أشجار حوله','الصمت جزء من الموسيقى','الظلام يزحف من الأطراف نحو المركز','الرمل والثلج والمرجان تُلوَّن أيضاً','اضغط Tab لفتح الخريطة','البداية رمادية… والنهاية ملوّنة'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);

/* ═══ الإعدادات ═══ */
let S={mus:.6,sfx:.8,q:2,sens:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('fajr_set')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('fajr_set',JSON.stringify(S))}catch(e){}};

/* ═══ المشهد والمعالجة اللاحقة ═══ */
const cv=$('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x4a4f56);scene.fog=new THREE.Fog(0x4a4f56,18,70);
const camera=new THREE.PerspectiveCamera(75,1,.1,300);camera.rotation.order='YXZ';
const hemi=new THREE.HemisphereLight(0xfff5e0,0x2a2418,1.4);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1.8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0008;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:160});
scene.add(sun,sun.target);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.85,.5,.8);composer.addPass(bloom);
const FX={uniforms:{tDiffuse:{value:null},vig:{value:.3},desat:{value:0},red:{value:0},t:{value:0},fade:{value:0}},
vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform sampler2D tDiffuse;uniform float vig,desat,red,t,fade;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+t)*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));c.rgb=mix(c.rgb,vec3(l),desat);c.r+=red;float d=distance(vUv,vec2(.5));c.rgb*=1.-smoothstep(.3,.85,d)*vig*2.;c.rgb+=(h(vUv*500.)-.5)*.05;c.rgb*=1.-fade;gl_FragColor=c;}'};
const fxp=new ShaderPass(FX);composer.addPass(fxp);composer.addPass(new OutputPass());
function applyQ(){
 const q=S.q,pr=q===0?1:Math.min(devicePixelRatio,q===2?1.75:1.25);
 renderer.setPixelRatio(pr);composer.setPixelRatio(pr);
 bloom.enabled=q>0;sun.castShadow=q>0;
 ash.geometry.setDrawRange(0,q===0?100:q===1?200:300);
 resize();
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);

/* ═══ العالم ═══ */
const blocks=new Uint8Array(N*H*N),top=new Int16Array(SZ),rv=new Float32Array(SZ),rvT=new Uint8Array(SZ);
const ed=new Map(),lights=[];
let pendI=[],pendT=[],revCount=0,dirty=true,colDirty=false,lastRb=0;
const idx=(x,y,z)=>(y*N+z)*N+x;
const get=(x,y,z)=>(x<0||z<0||x>=N||z>=N||y<0)?3:(y>=H?0:blocks[idx(x,y,z)]);
const opq=(x,y,z)=>{const v=get(x,y,z);return v>0&&v!==7&&v!==8};
function setB(x,y,z,t){if(x<0||z<0||x>=N||z>=N||y<0||y>=H)return;const i=idx(x,y,z);blocks[i]=t;ed.set(i,t);dirty=true}
function rnd(ix,iz,s){let n=Math.imul(ix|0,374761393)^Math.imul(iz|0,668265263)^Math.imul(s|0,1442695041);n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296}
function vn(x,z,s){const x0=Math.floor(x),z0=Math.floor(z),fx=x-x0,fz=z-z0,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
 const a=rnd(x0,z0,s),b=rnd(x0+1,z0,s),c=rnd(x0,z0+1,s),d=rnd(x0+1,z0+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,z,s)=>vn(x/16,z/16,s)*.6+vn(x/8,z/8,s+7)*.28+vn(x/4,z/4,s+13)*.12;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function gen(seed){
 blocks.fill(0);ed.clear();rv.fill(0);rvT.fill(0);pendI=[];pendT=[];revCount=0;
 const hm=new Int16Array(SZ);
 for(let z=0;z<N;z++)for(let x=0;x<N;x++){
  const n=fbm(x,z,seed),sx=sm((x-27)/10),sz=sm((z-27)/10);
  const h=Math.floor(lerp(lerp(7+n*9,5+n*5,sx),lerp(8+n*22,3+n*7,sx),sz));
  const b=(x>=32?1:0)+(z>=32?2:0);hm[z*N+x]=h;
  for(let y=0;y<=h;y++){
   let t=3;
   if(y>=h-2&&y>0){t=b===0?(y===h?1:2):(b===1||b===3)?6:(y===h&&y>14?11:3)}
   blocks[idx(x,y,z)]=t;
  }
  if(b===3&&rnd(x,z,seed+5)<.05&&h+1<H)blocks[idx(x,h+1,z)]=12;
 }
 HC.forEach(([cx,cz],i)=>{
  const base=hm[cz*N+cx];
  for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++){
   const x=cx+dx,z=cz+dz;
   for(let y=0;y<H;y++){const j=idx(x,y,z);if(y<=base){if(!blocks[j])blocks[j]=3}else blocks[j]=0}
   if(Math.abs(dx)<=2&&Math.abs(dz)<=2)blocks[idx(x,base,z)]=3;
  }
  blocks[idx(cx,base+1,cz)]=9;HY[i]=base+1;
  [[-2,-2],[2,-2],[-2,2],[2,2]].forEach(([a,c])=>{blocks[idx(cx+a,base+1,cz+c)]=3;blocks[idx(cx+a,base+2,cz+c)]=3});
 });
 for(let i=0;i<70;i++){
  const x=1+Math.floor(rnd(i,1,seed)*29),z=1+Math.floor(rnd(i,2,seed)*29);
  if(Math.abs(x-16)<6&&Math.abs(z-16)<6)continue;
  let y=H-1;while(y>0&&!blocks[idx(x,y,z)])y--;
  if(blocks[idx(x,y,z)]!==1)continue;
  const th=4+Math.floor(rnd(i,3,seed)*3);
  for(let k=1;k<=th;k++)blocks[idx(x,y+k,z)]=4;
  const dx=rnd(i,4,seed)<.5?1:-1;blocks[idx(x+dx,y+th-1,z)]=4;blocks[idx(x-dx,y+th-2,z)]=4;
 }
 dirty=true;
}
function surfaceY(x,z){for(let y=H-1;y>=0;y--)if(opq(x,y,z))return y+1;return 1}

/* ═══ تجسيد الكتل ═══ */
const geo=new THREE.BoxGeometry(1,1,1),CAP=20000;
const lam=new THREE.MeshLambertMaterial(),glw=new THREE.MeshBasicMaterial();
const meshes=[null];
for(let t=1;t<=12;t++){
 const gl=t===8||t===10||t===12;
 const m=new THREE.InstancedMesh(geo,gl?glw:lam,CAP);
 m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(CAP*3),3);
 m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.instanceColor.setUsage(THREE.DynamicDrawUsage);
 m.frustumCulled=false;m.count=0;m.castShadow=!gl;m.receiveShadow=true;scene.add(m);meshes.push(m);
}
const dum=new THREE.Object3D(),colA=new THREE.Color(),colB=new THREE.Color();
function rebuild(){
 const cnt=new Int32Array(13);lights.length=0;top.fill(0);
 for(let y=0;y<H;y++)for(let z=0;z<N;z++)for(let x=0;x<N;x++){
  const t=blocks[idx(x,y,z)];if(!t)continue;

 if(!active)return;
 try{
  const rl=[];for(let i=0;i<SZ;i++)if(rvT[i])rl.push(i);
  const e=[];ed.forEach((t,i)=>e.push(i,t));
  localStorage.setItem(SAVE,JSON.stringify({name:wname,seed:wseed,diff,tod,nights,days,light,inv,trees,grow,jr,torchPlaced,lastH,dark,
   ex:Array.from(ex).join(''),rv:rl,ed:e,p:[P.x,P.y,P.z,P.yaw],ts:Date.now()}));
 }catch(e){console.error(e)}
}
function readSave(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}
function loadGame(s){
 wname=s.name;wseed=s.seed;diff=s.diff;gen(wseed);
 for(let i=0;i<s.ed.length;i+=2){blocks[s.ed[i]]=s.ed[i+1];ed.set(s.ed[i],s.ed[i+1])}
 s.rv.forEach(i=>{rvT[i]=1;rv[i]=1;revCount++});ratio=Math.min(1,revCount/800);
 tod=prevTod=s.tod;nights=s.nights;days=s.days;light=s.light;inv=s.inv;trees=s.trees;grow=s.grow;jr=s.jr;torchPlaced=!!s.torchPlaced;lastH=s.lastH;dark=s.dark||0;
 ex=Uint8Array.from(s.ex.split('').map(Number));P.x=s.p[0];P.y=s.p[1];P.z=s.p[2];P.yaw=s.p[3];P.pit=0;P.vx=P.vy=P.vz=0;
 clearHL();for(let i=0;i<4;i++)if(hlit(i))mkHL(i);
 rebuild();
}
function clearHL(){hearthLights.forEach((l,i)=>{if(l){scene.remove(l);hearthLights[i]=null}})}
function newGame(name,d,seed){
 wname=name;diff=d;wseed=seed;gen(seed);clearHL();
 tod=prevTod=100;nights=0;days=1;light=100;inv={7:5,8:3};trees=[];grow=[];jr=[];ex=new Uint8Array(SZ);lastH=-1;dark=0;torchPlaced=false;ratio=0;
 rebuild();P.x=10.5;P.z=10.5;P.y=surfaceY(10,10);P.vx=P.vy=P.vz=0;P.yaw=Math.PI*.25;P.pit=0;
}

/* ═══ التدفق ═══ */
function show(id){['splash','menu','newg','load','dead','endg'].forEach(s=>$(s).classList.toggle('on',s===id))}
function lockTry(){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function goMenu(){
 state='menu';ui=null;cine=null;$('panel').classList.remove('on');$('hud').classList.remove('on');$('skip').style.display='none';$('sub').style.opacity=0;
 const sv=readSave(),c=$('mCont');c.style.display=sv?'block':'none';
 if(sv){const m=Math.floor((Date.now()-sv.ts)/60000);$('mAgo').textContent='آخر لعب منذ '+(m<1?'لحظات':m<60?m+' دقيقة':m<1440?Math.floor(m/60)+' ساعة':Math.floor(m/1440)+' يوم')}
 show('menu');FX.uniforms.fade.value=0;FX.uniforms.desat.value=0;FX.uniforms.red.value=0;
}
function startLoading(fn){
 state='load';show('load');let k=0;$('lbi').style.width='0';
 const tip=()=>$('tip').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];tip();
 const ti=setInterval(tip,3000);
 setTimeout(()=>{fn();$('lbi').style.width='100%'},300);
 setTimeout(()=>{clearInterval(ti)},2600);
 const bi=setInterval(()=>{k+=.08;$('lbi').style.width=Math.min(95,easeOut(Math.min(k,1))*95)+'%'},200);
 setTimeout(()=>{clearInterval(bi);$('lbi').style.width='100%'},2300);
}
function beginPlay(withIntro){
 show(null);state='play';active=true;ui=null;$('hud').classList.add('on');updHB();
 if(withIntro){
  const ey=P.y+1.62;$('skip').style.display='block';
  cine={t:0,dur:9,f:k=>{camera.position.set(P.x,lerp(-1.5,ey,ease(Math.min(1,k*1.15))),P.z);camera.rotation.set(lerp(.9,0,ease(k)),P.yaw,0);
    FX.uniforms.fade.value=Math.max(0,1-k*6);$('sub').textContent='عدني إلى المواقد…';$('sub').style.opacity=k>.5&&k<.85?1:0;
    if(k>.3&&k<.9&&Math.random()<.2)burst(P.x+(Math.random()-.5)*3,ey-1+Math.random()*2,P.z+(Math.random()-.5)*3,0xffcf6b,1,.5,1.5,1)},
   end:()=>{$('skip').style.display='none';$('sub').style.opacity=0;FX.uniforms.fade.value=0;toast('WASD للحركة، والماوس للنظر',5000);lockTry()}};
 }else{lockTry();toast('أهلاً بعودتك')}
}
function startEnding(){
 sunBall.visible=true;const sx=P.x,sy=P.y+1.2,sz=P.z;
 for(let i=0;i<SZ;i++)if(!rvT[i]){const x=i%N,z=(i/N)|0;pendI.push(i);pendT.push(clock+Math.hypot(x-32,z-32)/45*2)}
 sfx.whoosh();addJ('زرعتُ فجراً في عالم نسي الضوء.');
 cine={t:0,dur:14,f:k=>{const e=ease(k),a=k*Math.PI*1.2,r=lerp(8,52,e);
   camera.position.set(32+Math.cos(a)*r,lerp(P.y+3,88,e),32+Math.sin(a)*r);camera.lookAt(32,6,32);
   sunBall.position.set(lerp(sx,32,e),lerp(sy,95,easeOut(k)),lerp(sz,32,e));sunBall.scale.setScalar(1+9*easeOut(Math.min(1,k*2)));
   burst(32+(Math.random()-.5)*60,60,32+(Math.random()-.5)*60,0xffe08a,5,0,4,.5);
   if(k>.7)FX.uniforms.fade.value=(k-.7)/.3*.5},
  end:()=>{sunBall.visible=false;state='endg';document.exitPointerLock();show('endg');try{localStorage.removeItem(SAVE)}catch(e){};active=false}};
}
function die(){
 state='dead';deadT=0;sfx.die();if(AC)mg.gain.setTargetAtTime(0,AC.currentTime,.6);mdown=false;
 setTimeout(()=>{if(state==='dead'){document.exitPointerLock();show('dead')}},1500);
}
function respawn(){
 const i=lastH>=0?lastH:-1;
 if(i>=0){P.x=HC[i][0]+3.5;P.z=HC[i][1]+.5}else{P.x=10.5;P.z=10.5}
 P.y=surfaceY(Math.floor(P.x),Math.floor(P.z));P.vx=P.vy=P.vz=0;light=100;state='play';show(null);
 if(AC)mg.gain.setTargetAtTime(1,AC.currentTime,.5);lockTry();
}

/* ═══ اللوحات (اليوميات) ═══ */
const col=t=>'#'+TC[t].toString(16).padStart(6,'0');
const RC=[{n:'مشعل × 4',a:'1 خشب',need:4,nn:1,give:8,gn:4},{n:'بذرتان',a:'1 أوراق',need:5,nn:1,give:7,gn:2},{n:'حجر',a:'3 تراب',need:2,nn:3,give:3,gn:1}];
function renderPanel(){
 const p=$('pg');let h='';
 if(ui==='pause')h='<h2>استراحة</h2><button class="b" data-a="close">متابعة</button><button class="b" data-a="map">الخريطة</button><button class="b" data-a="jr">اليوميات</button><button class="b" data-a="set">الإعدادات</button><button class="b" data-a="exit">حفظ وخروج</button>';
 else if(ui==='inv'){
  h='<h2>الحقيبة والتصنيع</h2><div class="g2"><div><b>المواد</b>'+[1,2,3,4,5,6,7,8].map(t=>'<div class="it"><i style="background:'+col(t)+'"></i><span>'+NM[t]+'</span><b>'+(inv[t]||0)+'</b></div>').join('')+'</div><div><b>الوصفات</b>'+
  RC.map((r,i)=>'<div class="it"><span>'+r.n+'<br><small>'+r.a+'</small></span>'+((inv[r.need]||0)>=r.nn?'<button data-a="craft" data-r="'+i+'">صنع</button><button data-a="craft" data-r="'+i+'" data-all="1">الكل</button>':'<small>ينقص</small>')+'</div>').join('')+'</div></div><button class="b" data-a="close" style="margin-top:12px">إغلاق</button>';
 }
 else if(ui==='map')h='<h2>الخريطة</h2><canvas id="mp" width="64" height="64"></canvas><button class="b" data-a="close" style="margin-top:12px">إغلاق</button>';
 else if(ui==='jr')h='<h2>اليوميات</h2>'+(jr.length?jr.slice().reverse().map(x=>'<div class="it"><span>'+x+'</span></div>').join(''):'<p style="text-align:center">لا شيء بعد…</p>')+'<button class="b" data-a="back" style="margin-top:12px">رجوع</button>';
 else if(ui==='set')h='<h2>الإعدادات</h2>الموسيقى<input type="range" min="0" max="1" step=".05" value="'+S.mus+'" data-k="mus">المؤثرات<input type="range" min="0" max="1" step=".05" value="'+S.sfx+'" data-k="sfx">حساسية الماوس<input type="range" min=".5" max="2" step=".1" value="'+S.sens+'" data-k="sens">الرسومات<div style="display:flex;gap:6px;margin:6px 0">'+['منخفضة','متوسطة','عالية'].map((n,i)=>'<button class="b" data-a="q" data-v="'+i+'" style="'+(S.q===i?'background:#ffcf6b':'')+'">'+n+'</button>').join('')+'</div><button class="b" data-a="reset">إعادة ضبط</button><button class="b" data-a="back">رجوع</button>';
 p.innerHTML=h;
 if(ui==='map'){const c=$('mp').getContext('2d');for(let z=0;z<N;z++)for(let x=0;x<N;x++){const i=z*N+x;if(!ex[i]&&!rvT[i])continue;
  const t=blocks[idx(x,Math.max(0,top[i]),z)]||3;c.fillStyle=rvT[i]?col(t):'#777b82';c.fillRect(x,z,1,1)}
  c.fillStyle='#ffcf6b';c.fillRect(Math.floor(P.x)-1,Math.floor(P.z)-1,3,3)}
}
function openPanel(n){ui=n;$('panel').classList.add('on');renderPanel();if(document.pointerLockElement)document.exitPointerLock()}
function closePanel(){ui=null;$('panel').classList.remove('on');if(state==='play'&&!cine)lockTry()}
$('panel').onclick=e=>{
 const a=e.target.closest('[data-a]');if(!a)return;audio();const v=a.dataset.a;
 if(v==='close')closePanel();
 else if(v==='map'||v==='jr'||v==='set'){ex.forEach((_,i)=>{});openPanel(v)}
 else if(v==='back'){state==='play'?openPanel('pause'):closePanel()}
 else if(v==='exit'){saveGame();active=false;goMenu()}
 else if(v==='craft'){const r=RC[+a.dataset.r];do{if((inv[r.need]||0)<r.nn)break;inv[r.need]-=r.nn;give(r.give,r.gn);sfx.place()}while(a.dataset.all);renderPanel()}
 else if(v==='q'){S.q=+a.dataset.v;saveS();applyQ();renderPanel()}
 else if(v==='reset'){S={mus:.6,sfx:.8,q:2,sens:1};saveS();setVol();applyQ();renderPanel()}
};
$('panel').oninput=e=>{const k=e.target.dataset.k;if(!k)return;S[k]=+e.target.value;saveS();setVol()};
$('panel').addEventListener('click',e=>{if(e.target.id==='panel'&&state!=='play')closePanel()});

/* ═══ الأحداث ═══ */
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(!locked&&state==='play'&&!ui&&!cine)openPanel('pause')});
addEventListener('mousemove',e=>{if(!locked||state!=='play'||cine)return;P.yaw-=e.movementX*.0022*S.sens;P.pit=clamp(P.pit-e.movementY*.0022*S.sens,-1.55,1.55)});
addEventListener('mousedown',e=>{if(!locked||state!=='play'||ui||cine)return;if(e.button===0)mdown=true;else if(e.button===2)rightClick()});
addEventListener('mouseup',e=>{if(e.button===0){mdown=false;bk=-1;bp=0}});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(state==='play'&&locked){sel=(sel+(e.deltaY>0?1:7))%8;updHB()}});
addEventListener('keydown',e=>{
 audio();if(AC&&AC.state==='suspended')AC.resume();
 keys[e.code]=true;
 if(e.code==='Tab'||e.code==='Space')e.preventDefault();
 if(state!=='play'||cine&&e.code!=='Escape')return;
 if(e.code==='Escape'&&ui)return closePanel();
 if(e.code==='KeyE'){ui==='inv'?closePanel():(!ui||ui==='pause')&&openPanel('inv')}
 else if(e.code==='Tab'){ui==='map'?closePanel():openPanel('map')}
 else if(e.code==='KeyF'&&!ui){fly=!fly;toast(fly?'وضع التحليق ✦':'وضع المشي')}
 else if(e.code==='KeyR'&&!ui){P.x=10.5;P.z=10.5;P.y=surfaceY(10,10);P.vy=0}
 else if(/^Digit[1-8]$/.test(e.code)){sel=+e.code.slice(5)-1;updHB()}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mdown=false});
$('cap').onclick=()=>{audio();lockTry()};
$('skip').onclick=()=>{if(cine){cine.t=cine.dur;if(state==='play')lockTry()}};
$('splash').onclick=()=>{audio();if(state==='splash')goMenu()};
setTimeout(()=>{if(state==='splash')goMenu()},4000);
$('mNew').onclick=()=>{audio();state='newg';show('newg')};
$('back').onclick=()=>goMenu();
$('mCont').onclick=()=>{audio();const s=readSave();if(!s)return;startLoading(()=>loadGame(s));setTimeout(()=>beginPlay(false),2700)};
$('mGfx').onclick=$('mSet').onclick=()=>{audio();openPanel('set')};
$('mExit').onclick=()=>{try{window.close()}catch(e){}toast('يمكنك إغلاق التبويب')};
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';setVol()};
document.querySelectorAll('#newg [data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#newg [data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('go').onclick=()=>{
 audio();const d=document.querySelector('#newg .sel').dataset.d,nm=$('wn').value.trim()||'عالمي الأول',sv=$('ws').value;
 const seed=sv!==''?Math.floor(+sv)||1:1+Math.floor(Math.random()*999999);
 startLoading(()=>newGame(nm,d,seed));setTimeout(()=>beginPlay(true),2700);
};
$('rise').onclick=respawn;
$('toMenu').onclick=()=>{FX.uniforms.fade.value=0;goMenu()};
addEventListener('beforeunload',saveGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});

/* ═══ الحلقة الرئيسية ═══ */
function sim(dt){
 const prev=tod;tod+=dt;if(tod>=780){tod-=780;days++}
 if(prevTod<480&&tod>=480){nights++;addJ('حلّ الليل '+nights+'.');if(diff!=='calm')toast('حلّ الليل… ابقَ قرب النور',3500)}
 prevTod=tod;
 dark=diff==='calm'?0:Math.min(24,Math.max(0,(diff==='hard'?3:2)*nights-8*litCount()));
 dkNow=lerp(dkNow,dark,Math.min(1,dt*.5));placeDark(dkNow);
 if(!cine)phys(dt);
 // شريط النور
 let near=false;for(const l of lights)if(Math.hypot(l[0]-P.x,l[1]-P.y-1,l[2]-P.z)<4){near=true;break}
 const s=sunF();let dl;
 if(near)dl=5;else if(tod<420)dl=8;else if(tod>=480&&tod<720)dl=diff==='hard'?-6:-3;else dl=-1.5;
 if(diff==='hard'&&dl<0&&!near)dl*=1;
 const inDark=dkNow>.5&&(P.x<dkNow||P.z<dkNow||P.x>N-dkNow||P.z>N-dkNow);
 if(inDark)dl-=20;
 if(!cine){light=clamp(light+dl*dt,diff==='calm'?20:0,100);if(light<=0&&diff!=='calm'&&state==='play')die()}
 growTick(dt);updRev(dt);
 if(dirty||(colDirty&&clock-lastRb>.12)){rebuild();lastRb=clock}
 // كسر وهدف
 hl.visible=false;let hint='';
 if(!cine){
  const r=ray();
  if(r){const b=get(r.x,r.y,r.z);hl.position.set(r.x+.5,r.y+.5,r.z+.5);hl.visible=true;
   if(b===9)hint='اضغط الزر الأيمن لإحياء المَوقد\n(10 خشب + 10 حجر + 5 أشجار قريبة)';
   if(mdown&&b!==9&&b!==10){const key=idx(r.x,r.y,r.z);if(key!==bk){bk=key;bp=0}bp+=dt;if(bp>=BT[b]){doBreak(r,b);bk=-1;bp=0}}else if(!mdown){bk=-1;bp=0}}
  else{bk=-1;bp=0}
 }
 const he=$('hint');he.textContent=hint;he.style.opacity=hint?1:0;he.style.whiteSpace='pre-line';
 exT-=dt;if(exT<=0){exT=.6;for(let z=Math.max(0,Math.floor(P.z)-9);z<=Math.min(N-1,Math.floor(P.z)+9);z++)for(let x=Math.max(0,Math.floor(P.x)-9);x<=Math.min(N-1,Math.floor(P.x)+9);x++)if(Math.hypot(x-P.x,z-P.z)<9)ex[z*N+x]=1}
 saveT+=dt;if(saveT>30){saveT=0;saveGame()}
}
function hud(){
 const q=light/100;$('arc').style.strokeDashoffset=163.4*(1-q);$('arc').style.stroke=light<30?'#ff4a3c':'#ffcf6b';
 $('lnum').textContent=Math.round(light);$('lightw').classList.toggle('low',light<20);
 $('dayt').textContent='اليوم '+days+'  '+(sunF()>.5?'☀':'☾');
 let best=1e9;for(let i=0;i<4;i++)if(!hlit(i))best=Math.min(best,Math.hypot(HC[i][0]-P.x,HC[i][1]-P.z));
 const near=clamp(1-best/60,0,1),sc=1+.1*Math.sin(clock*(3+near*10)),o=$('orbs');
 o.style.transform='scale('+sc.toFixed(3)+')';o.style.boxShadow='0 0 '+(10+near*40)+'px rgba(255,207,107,'+(.4+near*.6)+')';
 const lc=litCount();$('orbd').textContent='●'.repeat(lc)+'○'.repeat(4-lc);
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
 FX.uniforms.t.value=clock%100;
 if(state==='play'&&!ui){
  sim(dt);
  if(cine){cine.t+=dt;const k=Math.min(1,cine.t/cine.dur);cine.f(k);if(cine.t>=cine.dur){const e=cine.end;cine=null;e&&e()}}
  if(!cine){
   if(shk>0)shk-=dt;const sh=shk>0?.08:0,bob=P.g&&Math.hypot(P.vx,P.vz)>1?Math.sin(bobT)*.04:0;
   camera.position.set(P.x,P.y+1.62+bob,P.z);camera.rotation.set(P.pit+(Math.random()-.5)*sh,P.yaw+(Math.random()-.5)*sh,0);
  }
  hud();
  const lowv=clamp((30-light)/30,0,1);
  FX.uniforms.desat.value=lowv*.5;FX.uniforms.red.value=lowv*.1;
  FX.uniforms.vig.value=.3+lowv*.25+(dkNow>.5?.1:0);
 }else if(state==='dead'){
  deadT+=dt;FX.uniforms.desat.value=ease(Math.min(1,deadT/2));FX.uniforms.vig.value=.5;
 }else if(state==='play'&&ui){/* متوقف */}
 else{
  const a=clock*.03;camera.position.set(32+Math.cos(a)*46,26+Math.sin(clock*.4)*.4,32+Math.sin(a)*46);camera.lookAt(32,8,32);
  updRev(dt);if(dirty||(colDirty&&clock-lastRb>.12)){rebuild();lastRb=clock}
  FX.uniforms.vig.value=.3;
 }
 $('cap').style.display=(state==='play'&&!ui&&!locked&&!cine)?'flex':'none';
 sky();partUpd(dt);partsEnv(dt);
 composer.render();
}
/* ═══ بدء التشغيل ═══ */
try{
 gen(777);rebuild();sky();applyQ();updHB();
 // الشجرة الوحيدة الميتة في خلفية القائمة موجودة ضمن الأشجار المولّدة
 requestAnimationFrame(frame);
}catch(err){console.error(err)}
</script>
</body>
</html>
